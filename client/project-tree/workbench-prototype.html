const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const icon=(n,c='')=>`<svg class="icon ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.project}</svg>`;
function hydrate(root=document){root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,el.classList.contains('sm')?'sm':''));}
const host=id=>hosts.find(h=>h.id===id),project=id=>projects.find(p=>p.id===id),style=p=>`--pc:${p.color};--ps:${p.soft}`;
function toast(title,detail=''){const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('check')}<div><strong>${esc(title)}</strong>${detail?`<small>${esc(detail)}</small>`:''}</div><button aria-label="关闭">${icon('x','sm')}</button>`;el.querySelector('button').onclick=()=>el.remove();document.getElementById('toasts').append(el);setTimeout(()=>el.remove(),3600);}

/* Tree prototype：正式版替换为共享纯命令，校验父子、防环、顺序和 revision。 */
function findNode(id,nodes=state.tree,parent=null){for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.id===id)return{node:n,parent,siblings:nodes,index:i};if(n.children){const f=findNode(id,n.children,n);if(f)return f;}}return null;}
function descendant(source,target){const s=findNode(source)?.node;if(!s?.children)return false;return!!findNode(target,s.children);}
function nativeTree(){return[{id:'native',type:'folder',name:'全部 Paseo 项目',children:projects.filter(p=>p.id!=='notes').map(p=>({id:'n-'+p.id,type:'project',name:p.name,projectId:p.id,children:[{id:'nw-'+p.id,type:'workspace',name:p.branch,projectId:p.id}]}))}];}
function renderTree(){
 document.querySelectorAll('[data-action="view-mode"]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.view));
 const hb=document.querySelector('[data-action="toggle-hidden"]');hb.textContent=state.showHidden?'隐藏节点可见':'显示隐藏';hb.classList.toggle('active',state.showHidden);
 document.getElementById('tree-tools').classList.toggle('hidden',state.view==='native');
 const native=state.view==='native';document.getElementById('tree').innerHTML=(native?'<div class="native-note">当前为原生投影。自定义分类与排序已保留，切回即可继续。</div>':'')+treeNodes(native?nativeTree():state.tree,0,native);hydrate(document.getElementById('tree'));
}
function treeNodes(nodes,depth,native){return nodes.map(n=>{
 if(n.hidden&&!state.showHidden&&!native)return'';
 if(n.type==='project'&&n.flattened&&!native)return n.children?treeNodes(n.children,depth,native):'';
 const children=!!n.children?.length,open=state.expanded.has(n.id)||native,p=n.projectId?project(n.projectId):null,h=p?host(p.host):null;
 const type=n.type==='folder'?'folder':n.type==='project'?'project':'workspace';
 const toggle=children?`<button class="tree-toggle ${open?'open':''}" data-action="toggle-node" data-id="${n.id}">${icon('right','sm')}</button>`:'<span class="tree-toggle"></span>';
 return`<div><div class="tree-row ${n.type} ${state.selected===n.id?'selected':''} ${n.hidden?'ishidden':''}" style="padding-left:${5+depth*13}px" draggable="${!native}" data-action="select-node" data-id="${n.id}" data-node="${n.id}" title="${esc(p?p.path+' · '+h.name:n.name)}">${toggle}<span>${icon(type,'sm')}</span><span class="tree-name">${esc(n.name)}</span>${h?`<span class="dot ${h.status}"></span>`:''}${native?'':`<button class="iconbtn tree-more" data-action="node-menu" data-id="${n.id}">${icon('more','sm')}</button>`}</div>${children&&open?treeNodes(n.children,depth+1,native):''}</div>`;
 }).join('');}
function reorder(id,where){const f=findNode(id);if(!f)return;let to=f.index;if(where==='up')to=Math.max(0,f.index-1);if(where==='down')to=Math.min(f.siblings.length-1,f.index+1);if(where==='top')to=0;if(where==='bottom')to=f.siblings.length-1;if(to===f.index)return toast('已经在该位置','顺序没有变化');f.siblings.splice(f.index,1);f.siblings.splice(to,0,f.node);closeContext();renderTree();toast('排序已更新',f.node.name);}
function nodeMenu(id,anchor){closeContext();const n=findNode(id)?.node;if(!n)return;state.context=id;const menu=document.createElement('div');menu.className='context';menu.innerHTML=`${n.type==='folder'?`<button data-cmd="subfolder">${icon('plus')}新建子分类</button>`:''}<button data-cmd="rename">${icon('edit')}重命名</button><hr><button data-cmd="up">${icon('up')}上移</button><button data-cmd="down">${icon('down')}下移</button><button data-cmd="top">${icon('pin')}置顶</button><button data-cmd="bottom">${icon('down')}置底</button><hr>${n.type==='project'?`<button data-cmd="flatten">${icon('layers')}${n.flattened?'显示项目包装层':'扁平化项目节点'}</button>`:''}${n.type==='workspace'?`<button data-cmd="reset-placement">${icon('undo')}还原原生归属</button>`:''}<button data-cmd="hide">${icon(n.hidden?'eye':'eye-off')}${n.hidden?'显示节点':'隐藏节点'}</button>`;
 document.getElementById('context-root').append(menu);const r=anchor.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(innerWidth-198,r.right-190))+'px';menu.style.top=Math.max(8,Math.min(innerHeight-menu.offsetHeight-8,r.bottom+4))+'px';menu.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=e=>{e.stopPropagation();nodeCommand(id,b.dataset.cmd);});}
function closeContext(){state.context=null;document.getElementById('context-root').innerHTML='';}
function nodeCommand(id,cmd){const n=findNode(id)?.node;if(!n)return;if(['up','down','top','bottom'].includes(cmd))return reorder(id,cmd);if(cmd==='rename'){closeContext();return openModal('rename',{id});}if(cmd==='subfolder'){closeContext();return openModal('folder',{parentId:id});}if(cmd==='hide'){n.hidden=!n.hidden;toast(n.hidden?'节点已隐藏':'节点已恢复显示',n.hidden?'开启“显示隐藏”可再次找到它':n.name);}if(cmd==='flatten'){n.flattened=!n.flattened;toast(n.flattened?'已扁平化项目节点':'已恢复项目包装层',n.flattened?'workspace 已提升，物理归属未改变':n.name);}if(cmd==='reset-placement')toast('已还原原生归属','原型演示反馈；正式版会删除 placement 覆盖');closeContext();renderTree();}

/* Search prototype：模拟逐 Host 异步返回；正式版必须支持取消、迟到响应和离线标记。 */
function searchHero(compact=false){return`<section class="search-hero ${compact?'compact':''}">${compact?'':`<div class="eyebrow">${icon('sparkles','sm')}你的跨 Host 个人工作入口</div><h1>今天想继续<span class="gradient">什么工作？</span></h1><p class="subtitle">一个入口搜索项目、对话和服务器。保留你的组织方式，也理解你的工作上下文。</p>`}<div class="search-wrap"><div class="search-box ${state.searchOpen?'focus':''}">${state.searching?'<span class="spinner"></span>':icon('search')}<input id="global-search" class="search-input" value="${esc(state.query)}" placeholder="搜索项目、对话或 Paseo Host…" autocomplete="off">${state.query?`<button class="iconbtn" data-action="clear-search">${icon('x','sm')}</button>`:'<kbd>/</kbd>'}<button class="btn primary search-submit" data-action="run-search">搜索</button></div><div class="search-scopes">${[['all','全部'],['project','项目'],['conversation','对话'],['host','服务器']].map(([id,name])=>`<button class="scope ${state.scope===id?'active':''}" data-action="search-scope" data-id="${id}">${name}</button>`).join('')}</div>${state.searchOpen?searchResults():''}</div>${compact?'':`<div class="quick-actions"><button class="quick" data-action="quick-search" data-query="Paseo">${icon('clock','sm')}继续 Paseo</button><button class="quick" data-action="prompt" data-text="哪些项目需要我关注？">${icon('sparkles','sm')}问问 AI：今天关注什么</button><button class="quick" data-action="add-project">${icon('plus','sm')}添加已有项目</button></div>`}</section>`;}
function matches(){const q=state.query.trim().toLowerCase(),out=[];if(!q)return out;if(['all','project'].includes(state.scope))projects.filter(p=>`${p.name} ${p.path} ${p.branch} ${host(p.host).name}`.toLowerCase().includes(q)).forEach(p=>out.push({type:'project',id:p.id,title:p.name,sub:`${p.path} · ${p.branch}`,host:p.host,icon:'project'}));if(['all','conversation'].includes(state.scope))conversations.filter(c=>`${c.title} ${c.project} ${host(c.host).name}`.toLowerCase().includes(q)).forEach(c=>out.push({type:'conversation',id:c.id,title:c.title,sub:`${c.project} · ${c.updated}`,host:c.host,icon:'message'}));if(['all','host'].includes(state.scope))hosts.filter(h=>`${h.name} ${h.place} ${h.status}`.toLowerCase().includes(q)).forEach(h=>out.push({type:'host',id:h.id,title:h.name,sub:`${h.place} · ${h.latency}`,host:h.id,icon:'server'}));return out;}
function searchResults(){if(state.searching)return'<div class="results"><div class="searching"><span class="spinner"></span>正在并行搜索 4 个 Host…</div></div>';if(!state.query.trim())return`<div class="results"><div class="result-head"><span>搜索建议</span><span>支持名称、路径与分支</span></div>${['Paseo','插件','巡检'].map(q=>`<button class="result" data-action="quick-search" data-query="${q}"><span class="result-icon">${icon('clock')}</span><span class="result-copy"><strong>${q}</strong><small>在最近资源中搜索</small></span></button>`).join('')}</div>`;const list=matches();if(!list.length)return`<div class="results"><div class="empty-search"><span class="result-icon" style="margin:auto">${icon('search')}</span><strong>没有找到“${esc(state.query)}”</strong><small>试试项目、目录、对话或 Host 名称</small></div></div>`;const labels={project:'项目',conversation:'对话',host:'服务器'};return`<div class="results"><div class="result-head"><span>找到 ${list.length} 项结果</span><span>3 个在线 · 1 个缓存</span></div>${list.slice(0,8).map(r=>{const h=host(r.host);return`<button class="result" data-action="open-result" data-type="${r.type}" data-id="${r.id}"><span class="result-icon">${icon(r.icon)}</span><span class="result-copy"><strong>${esc(r.title)}</strong><small>${esc(r.sub)}</small></span><span class="result-host"><span class="dot ${h.status}"></span> ${esc(h.name)}</span><span class="badge">${labels[r.type]}</span></button>`;}).join('')}</div>`;}
let searchTimer;
function paintSearch(){const wrap=document.querySelector('.search-wrap');if(!wrap)return;wrap.querySelector('.search-box').classList.toggle('focus',state.searchOpen);wrap.querySelectorAll('.results').forEach(el=>el.remove());if(state.searchOpen)wrap.insertAdjacentHTML('beforeend',searchResults());}
function bindSearch(){const input=document.getElementById('global-search');if(!input)return;input.addEventListener('focus',()=>{state.searchOpen=true;paintSearch();});input.addEventListener('input',e=>{state.query=e.target.value;state.searchOpen=true;state.searching=!!state.query.trim();clearTimeout(searchTimer);paintSearch();searchTimer=setTimeout(()=>{state.searching=false;paintSearch();},state.query.trim()?260:0);});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.searching=false;state.searchOpen=true;paintSearch();}});}

/* Workbench tabs + three variants */
function visibleProjects(){let list=projects;if(state.tab==='frequent')list=list.filter(p=>p.favorite||state.tabItems.frequent?.includes(p.id));else if(state.tab==='host-dev')list=list.filter(p=>p.host==='dev');else if(state.tab.startsWith('custom-'))list=list.filter(p=>state.tabItems[state.tab]?.includes(p.id));else list=list.filter(p=>p.tags.includes(state.tab));if(state.scenario!=='all')list=list.filter(p=>p.tags.includes(state.scenario));if(state.hostFilter!=='all')list=list.filter(p=>p.host===state.hostFilter);return list;}
function card(p){const h=host(p.host);return`<article class="project-card" style="${style(p)}"><div class="card-top"><div class="project-logo">${p.initials}</div><div class="card-title"><strong>${esc(p.name)}</strong><small><span class="dot ${h.status}"></span> ${esc(h.name)} · ${esc(p.branch)}</small></div><button class="iconbtn fav ${p.favorite?'active':''}" data-action="favorite" data-id="${p.id}">${icon('star','sm')}</button></div><div class="path" title="${esc(p.path)}">${esc(p.path)}</div><div><span class="badge ${h.status==='online'?'green':''}">${h.status==='offline'?'缓存数据':h.status==='warning'?'连接较慢':'Host 在线'}</span> <span class="badge ${p.tags.includes('ops')?'accent':''}">${p.tags.includes('ops')?'运维':'研发'}</span></div><div class="card-foot"><span class="activity">${esc(p.activity)} · ${esc(p.updated)}</span><button class="project-open" data-action="open-project" data-id="${p.id}">进入项目 ${icon('arrow-right','sm')}</button></div></article>`;}
function emptyTab(){return`<div class="empty-tab"><span class="result-icon" style="margin:auto">${icon('plus')}</span><h3>这个 tab 还没有项目</h3><p>从任意 Paseo Host 添加已有 project，不改变它的原生归属。</p><button class="btn primary" data-action="add-project">${icon('plus')}添加已有项目</button></div>`;}
function tabs(){return`<div class="tabs">${state.tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-action="tab" data-id="${t.id}">${icon(t.icon,'sm')}${esc(t.name)}</button>`).join('')}<button class="iconbtn" data-action="add-tab">${icon('plus','sm')}</button></div>`;}
function variantA(){const list=visibleProjects();return`${searchHero()}<section class="section"><div class="section-head"><div><strong>我的项目空间</strong><small>按你的工作方式组织，而不是按 Host 割裂</small></div><div class="section-actions"><button class="btn small" data-action="add-tab">${icon('plus','sm')}<span>新建 tab</span></button><button class="btn primary small" data-action="add-project">${icon('plus','sm')}<span>添加项目</span></button></div></div>${tabs()}<div class="project-grid">${list.length?list.map(card).join(''):emptyTab()}</div></section>`;}
function variantB(){const list=visibleProjects();return`<div class="b-head">${searchHero(true)}<div class="date"><strong>10 月 24 日</strong><small>星期六 · 3 个项目活跃</small></div></div><div class="list-layout"><aside class="rail"><div class="rail-title">工作视图</div>${state.tabs.slice(0,3).map(t=>`<button class="filter ${state.tab===t.id?'active':''}" data-action="tab" data-id="${t.id}">${icon(t.icon,'sm')}${esc(t.name)}<span class="count">${projects.filter(p=>t.id==='frequent'?p.favorite:p.tags.includes(t.id)).length}</span></button>`).join('')}<button class="filter" data-action="add-tab">${icon('plus','sm')}新建视图</button><div class="host-filters"><div class="rail-title">PASEO HOST</div>${hosts.map(h=>`<button class="filter ${state.hostFilter===h.id?'active':''}" data-action="host-filter" data-id="${h.id}"><span class="dot ${h.status}"></span>${esc(h.name)}</button>`).join('')}</div></aside><section class="list-panel"><div class="list-head"><strong>${list.length} 个项目</strong><button class="btn small" data-action="add-project">${icon('plus','sm')}添加项目</button></div>${list.length?list.map(p=>{const h=host(p.host);return`<div class="list-row" data-action="open-project" data-id="${p.id}" tabindex="0"><div class="list-name"><span class="project-logo" style="${style(p)}">${p.initials}</span><span><strong>${esc(p.name)}</strong><small><span class="dot ${h.status}"></span> ${esc(h.name)} · ${esc(p.branch)}</small></span></div><div class="list-path">${esc(p.path)}</div><div class="list-time">${esc(p.updated)}</div><div class="list-open">打开 ${icon('arrow-right','sm')}</div></div>`;}).join(''):emptyTab()}</section><aside class="today-rail"><div class="today"><div class="rail-title">今日工作概览</div><div class="today-num">6 <small>项进展</small></div><div class="progress"><span></span></div><p>3 个对话已完成，2 个任务正在运行，1 个 Host 需要关注。</p><button class="btn small" data-action="prompt" data-text="总结我今天的工作">${icon('sparkles','sm')}让 AI 总结</button></div><div class="attention"><div class="rail-title">需要关注</div><div class="attention-item"><span class="dot offline"></span><div><strong>ops-cluster-01 离线</strong><small>项目信息来自 2 小时前缓存</small></div></div><div class="attention-item"><span class="dot warning"></span><div><strong>证书轮换待确认</strong><small>Observability · edge-region-b</small></div></div></div></aside></div>`;}
function variantC(){const visibleHosts=state.hostFilter==='all'?hosts:hosts.filter(h=>h.id===state.hostFilter);return`<div class="matrix-head"><div class="matrix-title"><div class="eyebrow">${icon('server','sm')}分布式资源总览</div><h1>所有 Host，都在一个视野里。</h1><p>按物理执行环境查看项目，保留离线状态与数据新鲜度。</p></div>${searchHero(true)}</div><div class="host-health">${hosts.map(h=>`<button class="host-card ${state.hostFilter===h.id?'active':''}" data-action="host-filter" data-id="${h.id}"><span class="result-icon">${icon('server')}</span><span><strong>${esc(h.name)}</strong><small><span class="dot ${h.status}"></span> ${h.latency} · ${projects.filter(p=>p.host===h.id).length} 个项目</small></span></button>`).join('')}</div><div class="section-head"><div><strong>Host 项目矩阵</strong><small>点击 Host 卡聚焦，支持跨 Host 同一项目</small></div><div class="section-actions"><button class="btn small" data-action="clear-host">${icon('layers','sm')}全部 Host</button><button class="btn primary small" data-action="add-project">${icon('plus','sm')}添加项目</button></div></div><div class="host-columns">${visibleHosts.map(h=>{const list=projects.filter(p=>p.host===h.id&&(state.scenario==='all'||p.tags.includes(state.scenario)));return`<section class="host-column ${h.status==='offline'?'offline':''}"><div class="column-head"><span class="dot ${h.status}"></span><strong>${esc(h.name)}</strong><span>${h.status==='offline'?'缓存 · 2h':h.latency}</span></div>${list.map(p=>`<button class="host-project" data-action="open-project" data-id="${p.id}"><div class="host-project-top"><span class="project-logo" style="${style(p)}">${p.initials}</span><strong>${esc(p.name)}</strong>${p.favorite?icon('star','sm'):''}</div><div class="host-project-path">${esc(p.path)}</div><div class="host-project-foot"><span>${esc(p.branch)}</span><span>${esc(p.updated)}</span></div></button>`).join('')}<button class="host-add" data-action="add-project" data-host="${h.id}">${icon('plus','sm')}添加到此 Host 视图</button></section>`;}).join('')}</div>`;}
function renderContent(focus=false){document.getElementById('content').innerHTML=state.variant==='A'?variantA():state.variant==='B'?variantB():variantC();document.getElementById('variant-name').textContent={A:'A · 搜索优先',B:'B · 效率列表',C:'C · Host 矩阵'}[state.variant];document.getElementById('variant-dots').innerHTML=['A','B','C'].map(v=>`<i class="${v===state.variant?'active':''}"></i>`).join('');hydrate(document.getElementById('content'));bindSearch();if(focus){const i=document.getElementById('global-search');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}}
function renderAll(){renderTree();renderContent();renderMessages();}

/* Modal forms：正式版替换为 Paseo Modal；这里演示校验、选择、禁用与确认反馈。 */
function modalShell(title,desc,body,footer,ic='project',wide=false){return`<div class="modal-overlay" data-action="overlay"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><span class="result-icon">${icon(ic)}</span><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><button class="iconbtn" data-action="close-modal">${icon('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></section></div>`;}
function openModal(type,payload={}){closeContext();state.modal={type,payload};if(type==='add'){state.selectedProjects=new Set();state.pickerQuery='';state.pickerHost=payload.host||'all';}const root=document.getElementById('modal-root');root.innerHTML=modalTemplate(type,payload);hydrate(root);bindModal();setTimeout(()=>root.querySelector('input:not([type=checkbox]),textarea')?.focus(),30);}
function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML='';}
function modalTemplate(type,payload={}){
 if(type==='folder')return modalShell('新建自定义分类',payload.parentId?'在所选分类下创建子级，层级不设上限。':'创建顶层分类，后续可自由拖拽。',`<form id="folder-form"><div class="field"><label>分类名称</label><input id="folder-name" class="input" placeholder="例如：客户端与插件" maxlength="40"><div id="folder-error" class="error"></div><div class="hint">分类只影响当前自定义视图，不会修改原生 project。</div></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="submit-folder">创建分类</button>`,'folder');
 if(type==='rename'){const n=findNode(payload.id)?.node;return modalShell('重命名节点','仅修改自定义视图中的显示名称。',`<form id="rename-form"><div class="field"><label>显示名称</label><input id="rename-name" class="input" value="${esc(n?.name)}"><div id="rename-error" class="error"></div></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="submit-rename">保存</button>`,'edit');}
 if(type==='tab')return modalShell('新建工作台 tab','创建手动收藏或动态查询视图。',`<form id="tab-form"><div class="field"><label>tab 名称</label><input id="tab-name" class="input" placeholder="例如：发布检查"><div id="tab-error" class="error"></div></div><div class="field"><label>内容方式</label><select class="select"><option>手动添加项目</option><option>按场景动态筛选（原型模拟）</option></select><div class="hint">手动 tab 与项目是多对多关系，不会移动树节点。</div></div></form>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="submit-tab">创建并添加项目</button>`,'plus');
 if(type==='add')return modalShell('添加已有项目',`添加到“${state.tabs.find(t=>t.id===state.tab)?.name||'当前 tab'}”，不改变项目归属。`,`<div class="picker-search">${icon('search')}<input id="picker-query" class="input" placeholder="搜索项目名称或路径"></div><div class="picker-filters"><select id="picker-host" class="select"><option value="all">全部 Paseo Host</option>${hosts.map(h=>`<option value="${h.id}" ${state.pickerHost===h.id?'selected':''}>${h.name}</option>`).join('')}</select></div>${pickerList()}<div id="picker-note" class="selection-note">尚未选择项目</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="submit-projects" disabled>添加所选项目</button>`,'project',true);
 if(type==='restore')return modalShell('还原为原生布局？','当前自定义布局会先保存为原型快照。',`<div class="restore-box"><strong>将执行：</strong><br>清除 workspace 位置覆盖、恢复项目包装层，并按原生 project → workspace 排列。<br><br><strong>不会执行：</strong><br>不会删除或移动真实项目、目录、workspace 和对话。</div>`,`<button class="btn" data-action="close-modal">保留当前布局</button><button class="btn primary" data-action="confirm-restore">创建快照并还原</button>`,'undo');
 if(type==='memory')return modalShell('个人记忆','控制 AI 可以使用什么；所有记忆都可查看和停用。',`<div class="memory-list">${state.memories.map(m=>`<div class="memory-item"><div class="memory-copy"><strong>${esc(m.text)}</strong><small>${esc(m.scope)} · ${esc(m.source)}</small></div><label class="switch"><input type="checkbox" data-memory="${m.id}" ${m.enabled?'checked':''}><span></span></label></div>`).join('')}</div><form id="memory-form" class="memory-add"><input id="memory-input" class="input" placeholder="添加明确记忆，例如：默认使用 pnpm"><button class="btn primary">添加</button></form><div class="hint" style="margin-top:11px">后续接入：作用域过滤、来源引用、冲突替代、TTL 与敏感信息保护。</div>`,`<button class="btn" data-action="close-modal">完成</button><button class="btn" data-action="memory-preview">${icon('eye','sm')}预览注入上下文</button>`,'brain',true);
 return'';
}
function pickerList(){const q=state.pickerQuery.toLowerCase(),list=projects.filter(p=>(state.pickerHost==='all'||p.host===state.pickerHost)&&`${p.name} ${p.path}`.toLowerCase().includes(q));return`<div id="picker-list" class="picker-list">${list.length?list.map(p=>{const h=host(p.host);return`<label class="picker-item ${state.selectedProjects.has(p.id)?'selected':''} ${h.status==='offline'?'offline':''}"><input type="checkbox" data-check="${p.id}" ${state.selectedProjects.has(p.id)?'checked':''}><span class="project-logo" style="${style(p)}">${p.initials}</span><span class="picker-copy"><strong>${esc(p.name)}</strong><small>${esc(p.path)}</small></span><span class="badge"><span class="dot ${h.status}"></span>${esc(h.name)}</span></label>`;}).join(''):'<div class="empty-search">没有匹配的项目</div>'}</div>`;}
function refreshPicker(){const old=document.getElementById('picker-list');if(old)old.outerHTML=pickerList();document.getElementById('picker-note').textContent=state.selectedProjects.size?`已选择 ${state.selectedProjects.size} 个项目实例，可来自不同 Host`:'尚未选择项目';const submit=document.querySelector('[data-action="submit-projects"]');if(submit)submit.disabled=!state.selectedProjects.size;bindChecks();}
function bindChecks(){document.querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>{i.checked?state.selectedProjects.add(i.dataset.check):state.selectedProjects.delete(i.dataset.check);refreshPicker();});}
function bindModal(){bindChecks();const pq=document.getElementById('picker-query');if(pq)pq.oninput=e=>{state.pickerQuery=e.target.value;refreshPicker();};const ph=document.getElementById('picker-host');if(ph)ph.onchange=e=>{state.pickerHost=e.target.value;refreshPicker();};document.querySelectorAll('[data-memory]').forEach(i=>i.onchange=()=>{const m=state.memories.find(m=>m.id===i.dataset.memory);m.enabled=i.checked;toast(m.enabled?'记忆已启用':'记忆已停用',m.text.slice(0,35));});const mf=document.getElementById('memory-form');if(mf)mf.onsubmit=e=>{e.preventDefault();const input=document.getElementById('memory-input');if(!input.value.trim()){input.classList.add('invalid');return;}state.memories.push({id:'m'+Date.now(),text:input.value.trim(),scope:'个人偏好',source:'用户确认',enabled:true});openModal('memory');toast('记忆已添加','后续对话可在个人偏好作用域使用');};['folder-name','rename-name','tab-name'].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=()=>{el.classList.remove('invalid');const err=el.parentElement.querySelector('.error');if(err)err.textContent='';};});document.getElementById('folder-form')?.addEventListener('submit',e=>{e.preventDefault();submitFolder();});document.getElementById('rename-form')?.addEventListener('submit',e=>{e.preventDefault();submitRename();});document.getElementById('tab-form')?.addEventListener('submit',e=>{e.preventDefault();submitTab();});}
function required(id,error){const el=document.getElementById(id);if(!el.value.trim()){el.classList.add('invalid');document.getElementById(error).textContent='请输入名称';el.focus();return null;}return el.value.trim();}
function submitFolder(){const name=required('folder-name','folder-error');if(!name)return;const parentId=state.modal.payload.parentId,n={id:'folder-'+Date.now(),type:'folder',name,children:[]};if(parentId){findNode(parentId).node.children.push(n);state.expanded.add(parentId);}else state.tree.unshift(n);closeModal();renderTree();toast('分类已创建',parentId?'已添加到所选子级':'已添加到顶层');}
function submitRename(){const name=required('rename-name','rename-error');if(!name)return;findNode(state.modal.payload.id).node.name=name;closeModal();renderTree();toast('名称已更新',name);}
function submitTab(){const name=required('tab-name','tab-error');if(!name)return;const id='custom-'+Date.now();state.tabs.push({id,name,icon:'star'});state.tabItems[id]=[];state.tab=id;closeModal();renderContent();toast('自定义 tab 已创建','现在可以添加已有项目');setTimeout(()=>openModal('add'),120);}
function submitProjects(){const count=state.selectedProjects.size;if(!count)return;state.tabItems[state.tab]=[...new Set([...(state.tabItems[state.tab]||[]),...state.selectedProjects])];closeModal();renderContent();toast(`已添加 ${count} 个项目`,'收藏关系已更新，原生项目归属保持不变');}

/* AI prototype：模拟回答与记忆写入；正式版由 Paseo Agent + Memory 模块替换。 */
function renderMessages(){const root=document.getElementById('messages');if(!state.messages.length&&!state.typing)root.innerHTML=`<div class="ai-welcome"><div class="ai-icon">${icon('sparkles')}</div><h3>从你的上下文开始</h3><p>我可以查找项目、继续对话、总结进展，也能把明确偏好保存为个人记忆。</p></div><div class="message"><span class="message-avatar">${icon('sparkles','sm')}</span><div class="bubble">现在看到 3 个在线 Host 和 4 个常用项目。ops-cluster-01 当前离线，我会把它的缓存数据标记为旧数据。</div></div>`;else root.innerHTML=state.messages.map(m=>`<div class="message ${m.role==='user'?'user':''}">${m.role==='assistant'?`<span class="message-avatar">${icon('sparkles','sm')}</span>`:''}<div class="bubble">${esc(m.text)}${m.source?'<br><span class="message-source" data-action="memory">↳ 使用了 3 条个人与项目记忆</span>':''}</div></div>`).join('')+(state.typing?`<div class="message"><span class="message-avatar">${icon('sparkles','sm')}</span><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>`:'');hydrate(root);root.scrollTop=root.scrollHeight;}
function sendMessage(text){const value=text.trim();if(!value||state.typing)return;document.getElementById('ai').classList.add('open');state.messages.push({role:'user',text:value});state.typing=true;renderMessages();setTimeout(()=>{let response='我已经理解你的请求。正式版本会基于所选作用域检索项目与记忆，并显示引用来源。';if(value.includes('关注'))response='建议优先关注两项：\n\n1. ops-cluster-01 当前离线，展示的是 2 小时前缓存。\n2. Observability 有一项证书轮换待确认。\n\nPaseo 与 GPU Cluster 当前都有活跃任务。';if(value.includes('昨天')||value.includes('今天'))response='今天你在 3 个项目中产生了 6 项进展：完成 project-tree 方案梳理，继续 GPU Cluster 利用率分析，并讨论了跨 Host 搜索。\n\n建议下一步先确认“隐藏”和“扁平化”语义。';if(value.includes('继续'))response='上次你在 Plugin Toolkit 中讨论“project-tree 虚拟投影与原生还原”。可以从这条对话继续，我会带上项目架构决策，但不会引入其他 Host 的私有内容。';if(value.startsWith('记住')){const text=value.replace(/^记住[，,:：\s]*/,'')||value;state.memories.push({id:'m'+Date.now(),text,scope:'个人偏好',source:'对话中明确确认',enabled:true});response=`已记住：“${text}”\n\n它已保存为个人偏好，你可以随时在记忆管理中停用。`;}state.messages.push({role:'assistant',text:response,source:true});state.typing=false;renderMessages();},850);}
function setVariant(v){state.variant=v;state.searchOpen=false;const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);renderContent();}
function cycle(delta){const vs=['A','B','C'];setVariant(vs[(vs.indexOf(state.variant)+delta+3)%3]);}

/* Global interactions */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-action]');
 if(!t){if(!e.target.closest('.search-wrap')&&state.searchOpen){state.searchOpen=false;renderContent();}if(!e.target.closest('.context'))closeContext();return;}
 const a=t.dataset.action;
 if(a==='overlay'){if(e.target===t)closeModal();return;}
 if(a!=='node-menu')closeContext();
 if(a==='open-side'){document.getElementById('sidebar').classList.add('open');document.getElementById('side-overlay').classList.add('open');}
 else if(a==='close-side'){document.getElementById('sidebar').classList.remove('open');document.getElementById('side-overlay').classList.remove('open');}
 else if(a==='workbench'){document.getElementById('sidebar').classList.remove('open');document.getElementById('side-overlay').classList.remove('open');state.searchOpen=false;renderContent();toast('已在工作台','默认入口独立于项目树视图');}
 else if(a==='dismiss')document.getElementById('notice').remove();
 else if(a==='notice')toast('2 项需要关注','ops-cluster-01 离线；证书轮换待确认');
 else if(a==='view-mode'){state.view=t.dataset.mode;renderTree();toast(state.view==='native'?'已切换原生视图':'已恢复自定义视图',state.view==='native'?'自定义布局已完整保留':'分类、排序与隐藏状态已恢复');}
 else if(a==='toggle-hidden'){state.showHidden=!state.showHidden;renderTree();}
 else if(a==='toggle-node'){const id=t.dataset.id;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);renderTree();}
 else if(a==='select-node'){if(e.target.closest('[data-action="toggle-node"],[data-action="node-menu"]'))return;state.selected=t.dataset.id;renderTree();const f=findNode(state.selected,state.view==='native'?nativeTree():state.tree);if(f?.node.projectId){const p=project(f.node.projectId);toast(f.node.name,p.path+' · '+host(p.host).name);}}
 else if(a==='node-menu'){e.stopPropagation();nodeMenu(t.dataset.id,t);}
 else if(a==='new-folder')openModal('folder');
 else if(a==='restore')openModal('restore');
 else if(a==='confirm-restore'){state.tree=structuredClone(nativeTree());state.expanded=new Set(['native']);closeModal();renderTree();toast('已创建快照并还原布局','仅改变展示，真实资源未修改');}
 else if(a==='tab'){state.tab=t.dataset.id;state.hostFilter='all';renderContent();}
 else if(a==='host-filter'){state.hostFilter=state.hostFilter===t.dataset.id?'all':t.dataset.id;renderContent();}
 else if(a==='clear-host'){state.hostFilter='all';renderContent();}
 else if(a==='favorite'){const p=project(t.dataset.id);p.favorite=!p.favorite;renderContent();toast(p.favorite?'已设为常用':'已取消常用',p.name);}
 else if(a==='open-project'){const p=project(t.dataset.id);toast('打开项目：'+p.name,p.path+' · '+host(p.host).name);}
 else if(a==='open-result'){state.searchOpen=false;renderContent();toast({project:'打开项目',conversation:'继续对话',host:'筛选 Host'}[t.dataset.type],t.dataset.id);}
 else if(a==='search-scope'){state.scope=t.dataset.id;state.searchOpen=true;renderContent(true);}
 else if(a==='clear-search'){state.query='';state.searching=false;state.searchOpen=true;renderContent(true);}
 else if(a==='quick-search'){state.query=t.dataset.query;state.searchOpen=true;state.searching=false;renderContent(true);}
 else if(a==='run-search'){state.searching=false;state.searchOpen=true;renderContent(true);}
 else if(a==='add-project')openModal('add',{host:t.dataset.host});
 else if(a==='add-tab')openModal('tab');
 else if(a==='close-modal')closeModal();
 else if(a==='submit-folder')submitFolder();
 else if(a==='submit-rename')submitRename();
 else if(a==='submit-tab')submitTab();
 else if(a==='submit-projects')submitProjects();
 else if(a==='memory')openModal('memory');
 else if(a==='memory-preview')toast('上下文预览','个人偏好 1 条 + 当前项目决策 1 条 + 运维约束 1 条');
 else if(a==='toggle-ai')document.getElementById('ai').classList.toggle('open');
 else if(a==='prompt')sendMessage(t.dataset.text);
 else if(a==='prev')cycle(-1);
 else if(a==='next')cycle(1);
});

/* Drag/drop：拖到分类/项目表示移入，拖到叶子表示插入其前；正式版提供明确 drop indicator。 */
document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-node]');if(!row||state.view==='native')return;state.dragged=row.dataset.node;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',state.dragged);});
document.addEventListener('dragover',e=>{const row=e.target.closest('[data-node]');if(!row||!state.dragged)return;e.preventDefault();document.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));row.classList.add('dragover');e.dataTransfer.dropEffect='move';});
document.addEventListener('drop',e=>{const row=e.target.closest('[data-node]');if(!row||!state.dragged)return;e.preventDefault();const sourceId=state.dragged,targetId=row.dataset.node;if(sourceId===targetId||descendant(sourceId,targetId)){toast('无法移动到这里','不能移动到自身或子节点');return;}const source=findNode(sourceId),target=findNode(targetId);source.siblings.splice(source.index,1);if(['folder','project'].includes(target.node.type)&&!target.node.flattened){target.node.children=target.node.children||[];target.node.children.push(source.node);state.expanded.add(targetId);}else target.siblings.splice(target.index,0,source.node);state.dragged=null;renderTree();toast('节点已移动',source.node.name+' · 物理资源归属未改变');});
document.addEventListener('dragend',()=>{state.dragged=null;document.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));});

document.getElementById('scenario').addEventListener('change',e=>{state.scenario=e.target.value;renderContent();toast('场景已切换',e.target.selectedOptions[0].textContent);});
document.getElementById('ai-form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('ai-input');sendMessage(input.value);input.value='';});
document.getElementById('ai-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('ai-form').requestSubmit();}});
document.addEventListener('keydown',e=>{
 const editing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
 if(e.key==='Escape'){if(state.modal)closeModal();else if(state.context)closeContext();else if(state.searchOpen){state.searchOpen=false;renderContent();}else{document.getElementById('ai').classList.remove('open');document.getElementById('sidebar').classList.remove('open');document.getElementById('side-overlay').classList.remove('open');}}
 if(e.key==='/'&&!editing&&!state.modal){e.preventDefault();document.getElementById('global-search')?.focus();}
 if(!editing&&!state.modal&&e.key==='ArrowLeft')cycle(-1);if(!editing&&!state.modal&&e.key==='ArrowRight')cycle(1);
});
window.addEventListener('resize',()=>{if(innerWidth>960){document.getElementById('sidebar').classList.remove('open');document.getElementById('side-overlay').classList.remove('open');}});
hydrate();renderAll();

</script>
</body>
</html>
